name: Lighthouse CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # Read from .nvmrc so CI cannot drift from the deploy environment.
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Run LHCI autorun
        run: npx @lhci/cli autorun --config ./.lighthouseci/ci-config.json --upload.target=temporary-public-storage
